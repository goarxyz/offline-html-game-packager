name: Refresh web-sourced game artwork

on:
  workflow_dispatch:

concurrency:
  group: refresh-web-covers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Search image index for inviting artwork
        run: npm run refresh-web-covers
      - name: Replace matching covers
        run: |
          count=$(find web-covers -type f -name '*.webp' | wc -l)
          test "$count" -ge 200
          find web-covers -type f -name '*.webp' -exec cp {} covers/ \;
          rm -rf web-covers
          echo "Replaced $count covers with web-sourced artwork"
      - name: Commit refreshed artwork
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add covers
          git diff --cached --quiet && exit 0
          git commit -m "Refresh game artwork from title-specific image search"
          git pull --rebase origin main
          git push origin HEAD:main